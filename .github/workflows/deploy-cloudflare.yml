name: Deploy Kingdom Factor to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kingdom-factor-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run the complete verification suite
        run: npm run verify

      - name: Confirm this is the newest protected main commit
        shell: bash
        run: |
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists. This stale deployment will stop."
            exit 1
          fi

      - name: Deploy the verified build to Cloudflare Workers
        run: ./node_modules/.bin/wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
